[workspace]
members = ["crates/pilus-protocol", "crates/pilus-client", "crates/pilus"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/kepelet/pilus"
rust-version = "1.96"

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

[workspace.dependencies]
anyhow = "1"
bincode = { version = "2", features = ["serde"] }
crossbeam-channel = "0.5"
crossterm = { version = "0.29", features = ["serde"] }
gpui-updater-core = "0.1"
gpui = { package = "gpui-pre", version = "=0.3.6" }
image = { version = "0.25", default-features = false, features = ["png"] }
# `runtime_shaders` stitches the Metal shader source instead of invoking the
# `metal` compiler at build time, so the app builds with only the command-line
# tools installed. `font-kit` supplies the macOS text backend.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.6", features = ["font-kit", "runtime_shaders"] }
interprocess = "2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSImage", "NSImageRep", "std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSBundle", "NSData", "NSProcessInfo", "NSString", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
unicode-segmentation = "1"
unicode-width = "0.2"

pilus-client = { path = "crates/pilus-client" }
pilus-protocol = { path = "crates/pilus-protocol" }

[profile.release]
lto = "thin"
strip = true
