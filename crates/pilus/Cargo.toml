[package]
name = "pilus"
description = "Native desktop client for a Luvus daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "pilus"

[[bin]]
name = "pilus"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["gui"]
gui = ["dep:gpui", "dep:gpui_platform", "dep:gpui-wry", "dep:wry"]
# Headless Metal rendering used by `gui::shots` to capture each surface to a
# PNG for visual consistency review. Not part of a normal build.
visual-test = ["gui", "gpui/test-support", "gpui_platform/test-support"]

[dependencies]
resvg = "=0.46.0"
# Mermaid fences in markdown. The `png` feature would pull a second resvg; we
# rasterize the SVG ourselves with the one above.
mermaid-rs-renderer = { version = "0.3", default-features = false }
anyhow.workspace = true
crossterm.workspace = true
gpui-updater-core.workspace = true
pilus-client.workspace = true
pilus-db.workspace = true
pilus-index.workspace = true
pilus-protocol.workspace = true
markdown.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# The window's log file; already built for GPUI, so this adds nothing to compile.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry", "ansi"] }
ureq.workspace = true
unicode-segmentation.workspace = true
syntect.workspace = true
gpui = { workspace = true, optional = true }
image.workspace = true
gpui_platform = { workspace = true, optional = true }
gpui-wry = { workspace = true, optional = true }
wry = { workspace = true, optional = true }
qrcode = { version = "0.14.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
objc2-user-notifications.workspace = true
block2.workspace = true
raw-window-handle = "0.6"

