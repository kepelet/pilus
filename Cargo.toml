[workspace]
members = ["crates/pilus-protocol", "crates/pilus-client", "crates/pilus-index", "crates/pilus-db", "crates/pilus", "crates/pilus-agent", "crates/pilus-mobile"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/kepelet/pilus"
rust-version = "1.96"

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

[workspace.dependencies]
anyhow = "1"
bincode = { version = "2", features = ["serde"] }
crossbeam-channel = "0.5"
crossterm = { version = "0.29", features = ["serde"] }
gpui-updater-core = "0.1"
# Embedded system webview for the Browser tab. 0.6.6 is the last release built
# against the `gpui-pre` pinned below; later ones need a newer gpui.
gpui-wry = "=0.6.6"
# `gpui-wry` builds on wry but does not re-export it; the builder is ours to drive.
wry = { package = "lb-wry", version = "0.53.3" }
gpui = { package = "gpui-pre", version = "=0.3.6" }
# The decoders GPUI already builds, so reading a picture's size costs no new code.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
# `runtime_shaders` stitches the Metal shader source instead of invoking the
# `metal` compiler at build time, so the app builds with only the command-line
# tools installed. `font-kit` supplies the macOS text backend.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.6", features = ["font-kit", "runtime_shaders"] }
interprocess = "2"
# Markdown parsing for rendered documents and GitHub bodies (markdown-rs).
markdown = "1"
objc2 = "0.6"
objc2-user-notifications = "0.3"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSAlert", "NSAppearance", "NSApplication", "NSAttributedString", "NSButton", "NSCell", "NSColor", "NSControl", "NSDockTile", "NSEvent", "NSFont", "NSGraphics", "NSImage", "NSImageRep", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSStringDrawing", "NSView", "NSVisualEffectView", "NSWindow", "objc2-core-foundation", "std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSAttributedString", "NSBundle", "NSData", "NSGeometry", "NSProcessInfo", "NSRange", "NSString", "NSValue", "std"] }
# `bundled` compiles SQLite from source with the C compiler the command-line
# tools already ship, so the index needs no system library.
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Reads the public Luvus release manifest for the daemon update check.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "json"] }
tracing = "0.1"
# Pure-Rust regex backend: the macOS build stays buildable with only the
# command-line tools, with no onig C library to compile.
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
unicode-segmentation = "1"
unicode-width = "0.2"

pilus-client = { path = "crates/pilus-client" }
pilus-index = { path = "crates/pilus-index" }
pilus-db = { path = "crates/pilus-db" }
pilus-agent = { path = "crates/pilus-agent" }
pilus-protocol = { path = "crates/pilus-protocol" }

[profile.release]
lto = "thin"
strip = true
